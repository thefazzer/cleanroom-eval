name: BankingEnv contracts
on: [pull_request, push]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest==9.0.2
      - run: python -m pytest banking_v3/tests -q
